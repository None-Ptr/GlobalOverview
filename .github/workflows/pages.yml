name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enables Pages (source = GitHub Actions) if it was never turned on;
      # without this the deploy step fails with 404 on first run.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      # Project pages live at /<repo>/, user pages at /. The web app is served
      # under /app/ so the hand-written landing page keeps the site root.
      - name: Compute base href
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "href=/app/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/$repo/app/" >> "$GITHUB_OUTPUT"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "${{ steps.base.outputs.href }}"

      # Assemble: landing page (docs/) at the root, Flutter app at /app/.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/app
          cp -r build/web/. _site/app/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
